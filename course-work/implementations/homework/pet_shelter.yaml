  "paths": {
    "/api/Adopters": {
      "get": {
        "tags": [
          "Adopters"
        ],
        "summary": "Retrieves a paginated list of adopters with optional filtering and sorting.",
        "parameters": [
          {
            "name": "lastName",
            "in": "query",
            "description": "Optional last name filter.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "phone",
            "in": "query",
            "description": "Optional phone number filter.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "sortBy",
            "in": "query",
            "description": "Field used for sorting.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "ascending",
            "in": "query",
            "description": "Determines whether sorting is ascending.",
            "schema": {
              "type": "boolean"
            }
          },
          {
            "name": "page",
            "in": "query",
            "description": "Page number.",
            "schema": {
              "type": "integer",
              "format": "int32",
              "default": 1
            }
          },
          {
            "name": "pageSize",
            "in": "query",
            "description": "Number of records per page.",
            "schema": {
              "type": "integer",
              "format": "int32",
              "default": 10
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/AdopterOutput"
                  }
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized"
          },
          "500": {
            "description": "Internal server error"
          }
        }
      },
      "post": {
        "tags": [
          "Adopters"
        ],
        "summary": "Creates a new adopter.",
        "requestBody": {
          "description": "Adopter information.",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/AdopterInput"
              }
            },
            "text/json": {
              "schema": {
                "$ref": "#/components/schemas/AdopterInput"
              }
            },
            "application/*+json": {
              "schema": {
                "$ref": "#/components/schemas/AdopterInput"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Success",
            "content": {
            "application/json": {
            "schema": {
            "$ref": "#/components/schemas/AdopterOutput"
          }
        }
      }
    },
        "400": {
          "description": "Invalid adopter data"
        },
        "401": {
          "description": "Unauthorized"
        },
        "500": {
          "description": "Internal server error"
          }
        }
      }
    },
