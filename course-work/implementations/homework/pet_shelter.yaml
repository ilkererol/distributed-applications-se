  "components": {
    "schemas": {
      "AdopterInput": {
        "type": "object",
        "required": [
          "firstName",
          "lastName",
          "phone",
          "registrationDate",
          "budgetContribution"
        ],
        "properties": {
          "firstName": {
            "type": "string",
            "description": "The adopter's first name. Maximum 20 characters.",
            "maxLength": 20
          },
          "lastName": {
            "type": "string",
            "description": "The adopter's last name. Maximum 20 characters.",
            "maxLength": 20
          },
          "phone": {
            "type": "string",
            "description": "The adopter's phone number. Maximum 15 characters.",
            "maxLength": 15
          },
          "registrationDate": {
            "type": "string",
            "description": "The date the adopter registered in the system.",
            "format": "date-time"
          },
          "budgetContribution": {
            "type": "number",
            "description": "The adopter's financial contribution.",
            "format": "double",
            "minimum": 0
          }
        },
        "additionalProperties": false,
        "description": "Input model for creating or updating an adopter."
      },
      "AdopterOutput": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "description": "Unique identifier of the adopter.",
            "format": "int32"
          },
          "firstName": {
            "type": "string",
            "description": "The adopter's first name.",
            "nullable": true
          },
          "lastName": {
            "type": "string",
            "description": "The adopter's last name.",
            "nullable": true
          },
          "phone": {
            "type": "string",
            "description": "The adopter's phone number.",
            "nullable": true
          },
          "registrationDate": {
            "type": "string",
            "description": "The date the adopter registered in the system.",
            "format": "date-time"
          },
          "budgetContribution": {
            "type": "number",
            "description": "The adopter's financial contribution.",
            "format": "double"
          }
        },
        "additionalProperties": false,
        "description": "Output model representing an adopter."
      },
      "AnimalInput": {
        "type": "object",
        "required": [
          "name",
          "species",
          "weight",
          "isVaccinated",
          "arrivalDate"
        ],
        "properties": {
          "name": {
            "type": "string",
            "description": "The animal's name. Maximum 15 characters.",
            "maxLength": 15
          },
          "species": {
            "type": "string",
            "description": "The animal's species. Maximum 20 characters.",
            "maxLength": 20
          },
          "birthDate": {
            "type": "string",
            "description": "The animal's date of birth. Optional.",
            "format": "date-time",
            "nullable": true
          },
          "weight": {
            "type": "number",
            "description": "The animal's weight in kilograms. Must be greater than zero.",
            "format": "double",
            "minimum": 0.01
          },
          "isVaccinated": {
            "type": "boolean",
            "description": "Indicates whether the animal has been vaccinated."
          },
          "arrivalDate": {
            "type": "string",
            "description": "The date the animal arrived at the shelter.",
            "format": "date-time"
          }
        },
        "additionalProperties": false,
        "description": "Input model for creating or updating an animal."
      },
      "AnimalOutput": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "description": "Unique identifier of the animal.",
            "format": "int32"
          },
          "name": {
            "type": "string",
            "description": "The animal's name.",
            "nullable": true
          },
          "species": {
            "type": "string",
            "description": "The animal's species (e.g. Dog, Cat).",
            "nullable": true
          },
          "birthDate": {
            "type": "string",
            "description": "The animal's date of birth. Null if unknown.",
            "format": "date-time",
            "nullable": true
          },
          "weight": {
            "type": "number",
            "description": "The animal's weight in kilograms.",
            "format": "double"
          },
          "isVaccinated": {
            "type": "boolean",
            "description": "Indicates whether the animal has been vaccinated."
          },
          "arrivalDate": {
            "type": "string",
            "description": "The date the animal arrived at the shelter.",
            "format": "date-time"
          }
        },
        "additionalProperties": false,
        "description": "Output model representing a shelter animal."
      },
      "ApplicationInput": {
        "type": "object",
        "required": [
          "animalId",
          "adopterId",
          "applicationDate",
          "processingFee"
        ],
        "properties": {
          "animalId": {
            "type": "integer",
            "description": "The identifier of the animal being adopted.",
            "format": "int32",
            "minimum": 1
          },
          "adopterId": {
            "type": "integer",
            "description": "The identifier of the adopter submitting the application.",
            "format": "int32",
            "minimum": 1
          },
          "applicationDate": {
            "type": "string",
            "description": "The date the application was submitted.",
            "format": "date-time"
          },
          "notes": {
            "type": "string",
            "description": "Optional notes or remarks about the application. Maximum 500 characters.",
            "maxLength": 500
          },
          "processingFee": {
            "type": "number",
            "description": "The processing fee for the adoption application. Must be greater than zero.",
            "format": "double",
